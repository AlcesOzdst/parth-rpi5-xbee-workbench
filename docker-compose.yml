version: '3.8'

services:
  zigbee-sim:
    build: .
    container_name: wsl_zigbee_simulator
    restart: unless-stopped
    depends_on:
      - mqtt-broker
    environment:
      - PYTHONUNBUFFERED=1
      - MQTT_BROKER_HOST=mqtt-broker
    volumes:
      - ./src:/app/src
    networks:
      - zigbee-net

  dashboard-ui:
    build: .
    container_name: zigbee_dashboard_ui
    restart: unless-stopped
    command: ["python3", "src/web_server.py"]
    ports:
      - "8080:8080"
    volumes:
      - ./src:/app/src
    networks:
      - zigbee-net

  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: zigbee_mqtt_broker
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - zigbee-net

networks:
  zigbee-net:
    driver: bridge
